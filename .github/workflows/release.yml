# 发布流水线:打 v* tag 自动构建两平台安装包 + updater 资产(.tar.gz/.exe + .sig +
# latest.json),挂到 GitHub Release。一键更新(tauri-plugin-updater)依赖这里的产物:
# latest.json 是 endpoint,.sig 由下方私钥签名、客户端用 tauri.conf 里的公钥校验。
#
# 必需 secrets(一次性配置,由维护者本机 `npm run tauri signer generate -- -w ~/.tauri/voice-notes.key`
# 生成后录入,私钥不进仓库):
#   TAURI_SIGNING_PRIVATE_KEY          私钥文件内容
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD 生成时设置的密码(未设则留空字符串)
# 同时把生成的公钥写进 src-tauri/tauri.conf.json 的 plugins.updater.pubkey。
#
# releaseDraft: true —— 产物齐了人工点发布,给真机抽验留窗口;发布后 latest.json
# 才会出现在 releases/latest 下,客户端一键更新随之生效。
name: release

# 仅 tag 触发,不留 workflow_dispatch:手动从分支跑会把 tagName 解析成分支名,
# tauri-action 会创建一个名叫「master」的垃圾 tag + draft release。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    # 签名密钥存放在 GitHub Environment「TAURI」——不声明 environment 时
    # secrets.TAURI_SIGNING_* 解析为空,产物无签名,一键更新校验必失败。
    environment: TAURI
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # tag 与应用版本一致性守卫:打了 v0.6.0 却忘 bump tauri.conf.json 时,
      # latest.json 会停在旧版本号——已装用户的 GitHub API 横幅说有新版、
      # updater 插件却说没有,一键更新全员永久降级成「打开发布页」。宁可构建失败。
      - name: tag 与 tauri.conf.json 版本一致性
        shell: bash
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$VER" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} 与 tauri.conf.json 版本 v$VER 不一致,先 bump 版本再打 tag"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # macOS 构建链:webrtc-audio-processing(bundled)经 meson/ninja 编译。
      # 刻意不装 brew abseil——装了会被 pkg-config 捡走变成共享链接(用户机器
      # 没有 brew abseil,启动必崩;且 brew 滚版本曾直接崩掉 v0.6.0 首次发版)。
      # 无系统 abseil 时 sys crate 走 meson wrap 拉取 abseil-cpp-20240722.0
      # 静态内嵌,二进制零动态依赖。显式卸载兜底未来 runner 镜像预装的情况,
      # beforeBundleCommand 的守卫脚本再挡最后一道。
      - name: macOS 构建依赖
        if: matrix.platform == 'macos-latest'
        run: |
          brew list abseil >/dev/null 2>&1 && brew uninstall --ignore-dependencies abseil || true
          brew install meson ninja pkg-config
      - run: npm ci
      # 钉 commit SHA 而非可变 tag(v0):此 step 持有 updater 签名私钥,
      # tag 被恶意重指即可窃 key、给全体客户端签恶意更新。升级时人工换 SHA。
      #
      # macOS 代码签名与公证(Environment「TAURI」的 Secrets,见 docs/macos-signing.md):
      # tauri-action 会用 APPLE_CERTIFICATE 建临时钥匙串并导入,按 APPLE_SIGNING_IDENTITY
      # 选身份签名,再用 APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID 提交公证并 staple。
      # 缺任一项即退回 ad-hoc(不会让构建失败,但产物是未签名的——发版前请确认
      # 日志里出现 "signing" 与 "notarizing" 两段)。Windows 构建忽略这些变量。
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "voice-notes ${{ github.ref_name }}"
          releaseDraft: true
      # tauri-action 只公证 .app,再把它打进 dmg——dmg 本身既没公证也没 staple。
      # 后果:app 拖出来能跑,但用户双击 dmg 挂载那一刻 Gatekeeper 仍报「无法验证开发者」。
      # v0.8.0 首次接入签名时实测到:dmg 判定 rejected/Unnotarized,内部 app 却是
      # accepted/Notarized。故在此单独公证 dmg 并 staple,再覆盖 Release 里的同名资产。
      - name: 公证 DMG 并替换 Release 资产
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DMG=$(ls -t src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          echo "公证 $DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          # 期望 accepted / source=Notarized Developer ID;不符即让发布失败,
          # 免得草稿里留一个会被 Gatekeeper 拦的包。
          spctl -a -vv -t open --context context:primary-signature "$DMG" 2>&1 | tee /tmp/spctl.txt
          grep -q "source=Notarized Developer ID" /tmp/spctl.txt \
            || { echo "::error::DMG 公证后仍未被 Gatekeeper 接受"; exit 1; }
          gh release upload "${{ github.ref_name }}" "$DMG" --clobber --repo "${{ github.repository }}"
