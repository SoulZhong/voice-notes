# Windows 编译真验证:开发机是 macOS,交叉 cargo build 被原生依赖 build script
# 卡死(ring 的 cc、webrtc-ap 的 meson 均需目标平台工具链,2026-07-18 实测),
# 唯一可行的 build script/最终链接验证是真 Windows runner。
# 只做 cargo build --lib(编译 + 最终链接),不打包不签名——
# 真机行为验收(环回采集/静默填充/断连自愈)仍需人工,见计划文档「验证边界」。
name: windows-check

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # sherpa-onnx-sys 的 build script 把预编译静态库下载到 target/ 下的这个
          # 目录,而 rust-cache 默认裁剪 target/——只缓存构建指纹、不缓存它。
          # 结果:指纹被恢复 ⇒ cargo 认为 build script 新鲜、跳过重跑 ⇒ 链接时
          # 找不到 sherpa-onnx-c-api。平时靠同一份 Cargo.lock 的完整缓存命中掩盖着,
          # 一旦依赖变更换了缓存键就必现(2026-08-18 接入 posthog-rs 时踩到)。
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt
      # DLL 占位步骤已删除:sherpa-onnx 官方 crate 默认静态链接(含 onnxruntime),
      # tauri.windows.conf.json 不再声明任何运行时 DLL 资源。这里必须真正 build：
      # cargo check 不做最终链接，会让静态库缺失或 MT/MD 运行时冲突静默过绿。
      - name: cargo build (lib, Windows msvc)
        working-directory: src-tauri
        run: cargo build --lib
