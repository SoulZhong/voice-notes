# Windows 编译真验证:开发机是 macOS,交叉 cargo check 被原生依赖 build script
# 卡死(ring 的 cc、webrtc-ap 的 meson 均需目标平台工具链,2026-07-18 实测),
# 唯一可行的类型检查/build script 验证是真 Windows runner。
# 只做 cargo check --lib(类型检查 + 全部 build script),不打包不签名——
# 真机行为验收(环回采集/静默填充/断连自愈)仍需人工,见计划文档「验证边界」。
name: windows-check

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # DLL 占位步骤已删除:sherpa-onnx 官方 crate 默认静态链接(含 onnxruntime),
      # tauri.windows.conf.json 不再声明任何运行时 DLL 资源。
      # 注意:cargo check 不做最终链接,静态库 MT 运行时与 MSVC 默认 MD 的潜在
      # 冲突要到真正 cargo build 才暴露——首个 Windows 打包版本需人工验证。
      - name: cargo check (lib, Windows msvc)
        working-directory: src-tauri
        run: cargo check --lib
