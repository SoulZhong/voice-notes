[package]
name = "voice-notes"
version = "0.13.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# speaker_eval(PR#79 评测工具链)入列后包里有两个 bin,`cargo run`(tauri dev 的
# DevCommand)无法自选,必须钉死默认 bin,否则 `npm run tauri dev` 直接报错。
default-run = "voice-notes"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# issue #98:编译 cxx/sherpa_barrier.cc(C++ 异常屏障,防 onnxruntime 异常穿 FFI)
cc = "1"

[dependencies]
# tray-icon: 启用 TrayIconBuilder 等托盘 API;image-png: Image::from_bytes 解码 PNG 图标所需。
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
# 产品分析与异常上报。默认特性含 async-client(需 tokio runtime),
# 桌面端在 run() 里同步初始化,故只取 error-tracking。
posthog-rs = { version = "0.19", default-features = false, features = ["error-tracking"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
crossbeam-channel = "0.5"
# 原生回放:音轨 WAV mmap 进混音回调(随机访问零拷贝,seek=改游标)。
memmap2 = "0.9"
hound = "3.5"
# k2-fsa 官方 Rust 绑定(sherpa-rs 已被上游弃用并指向此 crate)。默认静态链接
# (含 onnxruntime),macOS dylib / Windows DLL 分发面随之消失。sys 与安全 crate
# 必须同版本(同一 links 键,同一份原生库)。sys 直用原因见 asr/engine.rs 模块注释。
sherpa-onnx = "1.13.4"
sherpa-onnx-sys = "1.13.4"
chrono = "0.4"
# 实体规范名/别名/关系端点统一使用 Unicode full default case folding（如 ß == SS）。
unicode-casefold = "0.2"
ureq = "2"
sha2 = "0.10"
# UI 语言"跟随系统"的系统 locale 解析(零依赖小 crate,见 src/i18n.rs)。
sys-locale = "0.3"
# 系统名与真实系统版本(posthog-rs 已把它带进依赖树,直接用不增加体积)。
# 为什么不靠 posthog-rs 自己注入 $os:见 telemetry.rs env_props 的说明。
os_info = "3"
base64 = "0.22"
hex = "0.4"
bzip2 = "0.5"
tar = "0.4"
# webrtc-audio-processing 移至下方 [target.'cfg(not(windows))'.dependencies]:
# 上游官方不支持 MSVC,Windows 由 audio/aec_stub.rs 顶替同形 API。
# logging.rs 的 stderr 重定向(dup2/isatty)。
libc = "0.2"
toml_edit = "0.25.12"
rmcp = { version = "~2.1", features = ["server", "transport-io", "macros", "schemars"] }
# sync:云端流适配层用 mpsc 把同步 push 闭包桥到 WS 的 async 循环。
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "io-std", "time", "sync"] }
schemars = "1.2.1"
serde_yaml_ng = "0.10.0"
# 神经残余级(DTLN-aec):tract-onnx 纯 Rust 推理 + 纯 Rust FFT。
# 路线定版 ONNX:tflite 双路线硬闸双败(tract-tflite 负轴 ReduceMean panic;tflitec 要
# bazel 整编 TF 源码,不可维护),模型已离线转 ONNX(数值最大差 ~1e-6)挂本仓 release,
# 详见 .superpowers/sdd/p3b-task-1-report.md 偏差记录。0.21 与 rustc 1.89 兼容(spike 实证)。
tract-onnx = "0.21"
realfft = "3"
# Aing 知识图谱:全局实体注册表 + 笔记↔实体边,从所有 aing.json 派生可整库重建。
# bundled 静态编译 libsqlite3,不依赖系统库(与本仓其余原生依赖 bundled 风格一致)。
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
# WebSocketStream 的 Sink/Stream 扩展(split/send/next):收发要在同一个 select
# 里并行,必须先 split 成两半才不撞可变借用。
futures-util = "0.3"
flate2 = "1.1.9"
uuid = { version = "1.24.0", features = ["v4"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

[dev-dependencies]
tempfile = "3"

# Windows 排除:上游官方不支持 MSVC(CI 无 windows、issue #34 维护者明言无测试机、
# build.rs 走 meson+GCC 旗标),Windows 侧由 audio/aec_stub.rs 顶替同形 API
# (构造返回 Err → 无 AEC 降级,文本级回声去重兜底)。
[target.'cfg(not(windows))'.dependencies]
webrtc-audio-processing = { version = "2.1.0", features = ["bundled"] }

# Windows 仅原子替换短小 current pointer；immutable SQLite version 文件从不被替换。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "8", features = ["macos_13_0"] }
# P4 VPIO spike: Apple 内建 AEC(VoiceProcessingIO)采集麦克风。crate 名 `coreaudio`。
coreaudio-rs = { version = "0.12", default-features = false, features = ["audio_unit", "core_audio"] }
# P3 日历匹配:EventKit 读取日程标题/参会人。版本与 tauri 传递依赖的 objc2 0.6 /
# objc2-foundation 0.3 / block2 0.6 对齐,避免拉进第二份 objc2。
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
objc2-event-kit = { version = "0.3", features = [
    "EKEventStore",
    "EKEvent",
    "EKCalendarItem",
    "EKCalendar",
    "EKObject",
    "EKParticipant",
    "EKTypes",
    "block2",
] }

# dev 构建给本 crate 开基础优化:声纹全库比对(O(n²) 余弦)未优化时百人级库要数秒,
# 走查/dev 体验失真;opt-level 1 约 10 倍提速,增量编译代价可接受。release 不受影响。

# 开发/评测用二进制:一律挂 devtools 特性,默认(含 release 打包)不构建。
# 起因:release 构建会产出它们,而 Tauri 打包把 asr_chunk_probe(25MB)也捡进了
# .app——产品包里带着一个运行时根本不用的探针。与其猜 bundler 捡哪个,不如让
# 它们在 release 里根本不存在。本机跑:cargo run --features devtools --bin xxx
[features]
# 开发/评测二进制的开关,产品构建绝不启用。
devtools = []

[[bin]]
name = "asr_bench"
path = "src/bin/asr_bench.rs"
required-features = ["devtools"]

[[bin]]
name = "asr_chunk_probe"
path = "src/bin/asr_chunk_probe.rs"
required-features = ["devtools"]

[[bin]]
name = "diag_stats"
path = "src/bin/diag_stats.rs"
required-features = ["devtools"]

[[bin]]
name = "drift_stats"
path = "src/bin/drift_stats.rs"
required-features = ["devtools"]

[[bin]]
name = "scene_backfill"
path = "src/bin/scene_backfill.rs"
required-features = ["devtools"]

[[bin]]
name = "speaker_ab_eval"
path = "src/bin/speaker_ab_eval.rs"
required-features = ["devtools"]

[[bin]]
name = "echo_clean_repro"
path = "src/bin/echo_clean_repro.rs"
required-features = ["devtools"]

[[bin]]
name = "speaker_loso_eval"
path = "src/bin/speaker_loso_eval.rs"
required-features = ["devtools"]

[[bin]]
name = "speaker_eval"
path = "src/bin/speaker_eval.rs"
required-features = ["devtools"]

[[bin]]
name = "vp_probe"
path = "src/bin/vp_probe.rs"
required-features = ["devtools"]

[[bin]]
name = "xcorr_align"
path = "src/bin/xcorr_align.rs"
required-features = ["devtools"]

[profile.dev]
opt-level = 1
# 增量编译在「优化 dev profile」下会产坏 rlib(同一档案混两代 codegen 对象),链接报
# symbol not found,清 deps/incremental/fingerprint 重编还会再坏——2026-08-20/21 两次
# 实锤,指纹是「cargo test 全绿但 bin 链不动」。关掉后全量链接实测仅 ~30s,代价可忽略。
incremental = false

[profile.release]
# 实测 strip -x 可去掉 14.6MB 本地符号表(68.3 → 53.7MB);二进制里没有 DWARF
# 调试信息(strip -S 无变化),所以这一步不损失可调试性。
strip = "symbols"
